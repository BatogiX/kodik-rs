workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"

stages:
  - lint
  - build
  - release

variables:
  CARGO_TERM_COLOR: always
  CARGO_HOME: $CI_PROJECT_DIR/.cargo

.linux-common: &linux-common
  image: rust:latest
  before_script:
    - apt-get update -qq && apt-get install -y -qq pkg-config
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - target/
      - .cargo/registry/index/
      - .cargo/registry/cache/
      - .cargo/git/db/

lint:
  <<: *linux-common
  stage: lint
  script:
    - rustup component add rustfmt clippy
    - cargo fmt --all -- --check
    - cargo clippy --all-targets -- -D warnings
    - cargo test --workspace
    - cargo doc

.build:linux: &linux-build
  <<: *linux-common
  stage: build
  script:
    - cargo build --release -p kodik-rs

.build:windows: &windows-build
  image: rust:latest
  stage: build
  cache:
    key: ${CI_COMMIT_REF_SLUG}-windows
    paths:
      - target/
      - .cargo/registry/index/
      - .cargo/registry/cache/
      - .cargo/git/db/
  before_script:
    - apt-get update -qq && apt-get install -y -qq mingw-w64
    - rustup target add x86_64-pc-windows-gnu
  script:
    - export CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=x86_64-w64-mingw32-gcc
    - cargo build --release -p kodik-rs --target x86_64-pc-windows-gnu

build:linux:x86_64:
  <<: *linux-build
  artifacts:
    name: kodik-rs-linux-x86_64
    paths:
      - target/release/kodik
    expire_in: 1 week

build:windows:x86_64:
  <<: *windows-build
  artifacts:
    name: kodik-rs-windows-x86_64
    paths:
      - target/x86_64-pc-windows-gnu/release/kodik.exe
    expire_in: 1 week

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build:linux:x86_64
      artifacts: true
    - job: build:windows:x86_64
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - apk add --no-cache curl
  script:
    - |
      upload_asset() {
        if [ -f "$1" ]; then
          curl --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$1" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/kodik-rs/${CI_COMMIT_TAG}/$2"
        else
          echo "Warning: Asset $1 not found!"
        fi
      }
      upload_asset "target/release/kodik" "kodik-linux"
      upload_asset "target/x86_64-pc-windows-gnu/release/kodik.exe" "kodik-windows.exe"
  release:
    name: "Release $CI_COMMIT_TAG"
    description: "Automated release for $CI_COMMIT_TAG"
    tag_name: "$CI_COMMIT_TAG"
    assets:
      links:
        - name: "Linux Binary"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/kodik-rs/${CI_COMMIT_TAG}/kodik-linux"
        - name: "Windows Executable"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/kodik-rs/${CI_COMMIT_TAG}/kodik-windows.exe"
